<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Inicio - Entrada a Mohonitoreo</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #0f172a, #1e293b, #0f766e);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', sans-serif;
        }

        .menu-card {
            width: 100%;
            max-width: 520px;
            border: none;
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 20px 45px rgba(0, 0, 0, 0.35);
            background: white;
        }

        .menu-header {
            background: linear-gradient(135deg, #14b8a6, #0f766e);
            color: white;
            padding: 35px;
            text-align: center;
        }

        .menu-header h2 {
            font-weight: 800;
            margin: 0;
        }

        .menu-header p {
            margin: 10px 0 0;
            opacity: 0.9;
        }

        .menu-body {
            padding: 30px;
        }

        .menu-btn {
            border-radius: 16px;
            padding: 16px;
            font-size: 18px;
            font-weight: 700;
        }

        .small-text {
            color: #64748b;
            font-size: 14px;
            text-align: center;
            margin-top: 18px;
        }
    </style>
</head>

<body>

<div class="menu-card">

    <div class="menu-header">
        <h2>🌡️ Entrada a Mohonitoreo</h2>
        <p>Monitoreo de temperatura y humedad</p>
    </div>

    <div class="menu-body">

        <div class="d-grid gap-3">
            <a href="{{ url_for('login') }}" class="btn btn-primary menu-btn">
                Iniciar sesión
            </a>

            <a href="{{ url_for('recibir_contrasena') }}" class="btn btn-outline-dark menu-btn">
                Recibir contraseña
            </a>
        </div>

        <div class="small-text">
            Si ya tenés contraseña, entrá en Login. Si es tu primera vez, usá “Recibir contraseña”.
        </div>

    </div>

</div>

</body>
</html>
