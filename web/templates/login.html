<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Login - Entrada a Mohonitoreo</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #0f172a, #1e293b, #0f766e);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', sans-serif;
        }

        .login-card {
            width: 100%;
            max-width: 430px;
            border: none;
            border-radius: 22px;
            overflow: hidden;
            box-shadow: 0 20px 45px rgba(0, 0, 0, 0.35);
        }

        .login-header {
            background: linear-gradient(135deg, #14b8a6, #0f766e);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .login-header h3 {
            margin: 0;
            font-weight: 700;
        }

        .login-header p {
            margin: 8px 0 0;
            opacity: 0.9;
        }

        .login-body {
            padding: 30px;
            background: white;
        }

        .form-control {
            border-radius: 12px;
            padding: 12px;
        }

        .btn-login {
            border-radius: 12px;
            padding: 12px;
            font-weight: 600;
            background: #0f766e;
            border: none;
        }

        .btn-login:hover {
            background: #115e59;
        }

        .sensor-icon {
            font-size: 48px;
            margin-bottom: 10px;
        }

        .link-volver {
            display: block;
            margin-top: 18px;
            text-align: center;
            text-decoration: none;
        }
    </style>
</head>

<body>

<div class="login-card">

    <div class="login-header">
        <div class="sensor-icon">🌡️</div>
        <h3>Iniciar sesión</h3>
        <p>Ingresá con tu cédula y contraseña</p>
    </div>

    <div class="login-body">

        {% if error %}
            <div class="alert alert-danger">
                {{ error }}
            </div>
        {% endif %}

        <form method="POST">
            <div class="mb-3">
                <label class="form-label">Cédula</label>
                <input type="text" name="cedula" class="form-control" placeholder="Ingrese su cédula" required>
            </div>

            <div class="mb-4">
                <label class="form-label">Contraseña</label>
                <input type="password" name="contrasena" class="form-control" placeholder="Ingrese su contraseña" required>
            </div>

            <button type="submit" class="btn btn-primary btn-login w-100">
                Entrar
            </button>
        </form>

        <a href="{{ url_for('recibir_contrasena') }}" class="link-volver">
            ¿No tenés contraseña? Recibir contraseña
        </a>

        <a href="{{ url_for('menu') }}" class="link-volver text-muted">
            Volver al menú
        </a>

    </div>

</div>

</body>
</html>
