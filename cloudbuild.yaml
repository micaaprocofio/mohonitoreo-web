steps:
  - name: gcr.io/cloud-builders/docker
    id: Build
    args:
      - build
      - -t
      - gcr.io/$PROJECT_ID/mohonitoreo-web:$COMMIT_SHA
      - -t
      - gcr.io/$PROJECT_ID/mohonitoreo-web:latest
      - --build-arg
      - VITE_SUPABASE_URL=${_VITE_SUPABASE_URL}
      - --build-arg
      - VITE_SUPABASE_ANON_KEY=${_VITE_SUPABASE_ANON_KEY}
      - .

  - name: gcr.io/cloud-builders/docker
    id: Push
    args:
      - push
      - --all-tags
      - gcr.io/$PROJECT_ID/mohonitoreo-web

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    id: Deploy
    entrypoint: gcloud
    args:
      - run
      - deploy
      - mohonitoreo-web
      - --image
      - gcr.io/$PROJECT_ID/mohonitoreo-web:$COMMIT_SHA
      - --region
      - ${_REGION}
      - --platform
      - managed
      - --allow-unauthenticated

images:
  - gcr.io/$PROJECT_ID/mohonitoreo-web:$COMMIT_SHA

substitutions:
  _REGION: us-central1
  _VITE_SUPABASE_URL: ""
  _VITE_SUPABASE_ANON_KEY: ""

options:
  logging: CLOUD_LOGGING_ONLY
